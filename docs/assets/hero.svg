<text x="56" y="155" fill="#fafaf9" font-size="62" font-weight="700" letter-spacing="-3">House of Cards</text>
<text x="59" y="210" fill="#e2e8f4" font-size="26">Different funds.</text><text x="59" y="246" fill="#e2e8f4" font-size="26">The same hidden dependencies.</text>
<text x="59" y="307" fill="#a4b0c8" font-size="17">See the companies you own, the risks they share,</text><text x="59" y="333" fill="#a4b0c8" font-size="17">and what happens when one part fails.</text>
<path d="M59 391H539" stroke="#ffffff" stroke-opacity=".14"/><text x="59" y="421" fill="#bcd2ff" font-size="12" letter-spacing="2">REAL HOLDINGS · VERIFIED QUOTES · PYTHON MATHS</text>
