<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
<title id="title">House of Cards — see what is holding up your portfolio</title>
<desc id="desc">A portfolio card connects to three ETF cards, which converge on shared companies and a common supplier. Decorative illustration, not portfolio data.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12141b"/><stop offset="1" stop-color="#202b45"/></linearGradient></defs>
<rect width="1280" height="480" rx="24" fill="url(#bg)"/><rect width="1280" height="480" rx="24" fill="url(#grid)"/>
